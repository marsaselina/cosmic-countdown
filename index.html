
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170725">
<title>Cosmic Countdown</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #170725;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%,
      #69318f 0%, #35144f 48%, #10051d 100%);
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(#ffffffbb 1px, transparent 1.5px),
    radial-gradient(#d6adff88 1px, transparent 1.5px);
  background-size: 47px 61px, 83px 101px;
  background-position: 12px 18px, 35px 49px;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .45; }
  to { opacity: 1; }
}

.screen {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  padding: 30px 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: clamp(22px, 5vh, 45px);
  text-align: center;
}

.heading {
  max-width: 95%;
  color: #f1d8ff;
  font-size: clamp(18px, 5vw, 30px);
  font-weight: bold;
  letter-spacing: 2px;
  line-height: 1.4;
  text-shadow: 0 0 20px #e6a2ff99;
}

.planet {
  font-size: clamp(80px, 22vw, 130px);
  filter: drop-shadow(0 0 25px #c77dff99);
  animation: float 5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.timer {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  max-width: 700px;
}

.unit { min-width: 0; }

.display {
  width: 100%;
  aspect-ratio: 1.4;
  padding: 6px 3px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 2px;
  background: #030b07;
  border: 1px solid #a64bdf;
  border-radius: 10px;
  box-shadow:
    0 0 12px #b04dff77,
    inset 0 0 18px #000;
}

.digit {
  position: relative;
  flex: 1;
  height: 100%;
  max-width: 55px;
}

.segment {
  position: absolute;
  background: #16391f;
  opacity: .3;
  border-radius: 2px;
}

.segment.on {
  background: #3aff68;
  opacity: 1;
  box-shadow:
    0 0 7px #3aff68,
    0 0 15px #20e94d;
}

.a, .g, .d {
  left: 19%;
  width: 62%;
  height: 8%;
  clip-path: polygon(
    12% 0, 88% 0, 100% 50%,
    88% 100%, 12% 100%, 0 50%
  );
}

.a { top: 3%; }
.g { top: 46%; }
.d { bottom: 3%; }

.b, .c, .e, .f {
  width: 13%;
  height: 39%;
  clip-path: polygon(
    50% 0, 100% 12%, 100% 88%,
    50% 100%, 0 88%, 0 12%
  );
}

.f { left: 7%; top: 8%; }
.b { right: 7%; top: 8%; }
.e { left: 7%; bottom: 8%; }
.c { right: 7%; bottom: 8%; }

.label {
  margin-top: 12px;
  color: #c8ffd3;
  font-size: clamp(10px, 2.7vw, 15px);
  letter-spacing: 1px;
}

.date {
  color: #e8d0fa;
  font-size: clamp(14px, 4vw, 20px);
  letter-spacing: 1px;
}

@media (max-height: 650px) {
  .screen { gap: 15px; padding: 15px 10px; }
  .planet { font-size: 65px; }
}
</style>
</head>

<body>
<div class="stars"></div>

<main class="screen">

  <div class="heading">
    DOCKING: JUPITER 7 × MARS 0.1
  </div>

  <div class="planet">🪐</div>

  <div class="timer">

    <div class="unit">
      <div class="display" id="days"></div>
      <div class="label">DAYS</div>
    </div>

    <div class="unit">
      <div class="display" id="hours"></div>
      <div class="label">HOURS</div>
    </div>

    <div class="unit">
      <div class="display" id="minutes"></div>
      <div class="label">MIN</div>
    </div>

    <div class="unit">
      <div class="display" id="seconds"></div>
      <div class="label">SEC</div>
    </div>

  </div>

  <div class="date">
    14 NOVEMBER 2026 · 00:05
  </div>

</main>

<script>
const patterns = {
  0: "abcdef",
  1: "bc",
  2: "abged",
  3: "abgcd",
  4: "fgbc",
  5: "afgcd",
  6: "afgecd",
  7: "abc",
  8: "abcdefg",
  9: "abfgcd"
};

function drawDigit(number) {
  const digit = document.createElement("div");
  digit.className = "digit";

  const active = patterns[number] || "";

  for (const part of "abcdefg") {
    const segment = document.createElement("div");
    segment.className =
      "segment " + part +
      (active.includes(part) ? " on" : "");
    digit.appendChild(segment);
  }

  return digit;
}

function display(id, value) {
  const box = document.getElementById(id);
  box.replaceChildren();

  String(value).padStart(2, "0")
    .split("")
    .forEach(n => {
      box.appendChild(drawDigit(Number(n)));
    });
}

// Zurich time: 14 November 2026, 00:05
const target =
  new Date("2026-11-13T23:05:00Z").getTime();

function updateCountdown() {
  let remaining =
    Math.max(0, target - Date.now());

  const days =
    Math.floor(remaining / 86400000);
  remaining %= 86400000;

  const hours =
    Math.floor(remaining / 3600000);
  remaining %= 3600000;

  const minutes =
    Math.floor(remaining / 60000);
  remaining %= 60000;

  const seconds =
    Math.floor(remaining / 1000);

  display("days", days);
  display("hours", hours);
  display("minutes", minutes);
  display("seconds", seconds);
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
