<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Countdown</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Arial,sans-serif;text-align:center;
 background:radial-gradient(ellipse at 50% 35%,
 #672a91,#271345 55%,#050510);
}
.stars{
 position:fixed;inset:0;pointer-events:none;
 background-image:radial-gradient(white 1px,transparent 1px);
 background-size:37px 49px;opacity:.35;
 animation:twinkle 3s infinite alternate;
}
@keyframes twinkle{to{opacity:.65}}
main{position:relative;max-width:650px;margin:auto;padding:45px 10px}
h1{font-size:clamp(17px,5vw,26px);letter-spacing:2px;color:#f1dcff}
.planet{font-size:65px;margin:25px}
.clock{display:flex;gap:5px;margin:30px auto}
.unit{flex:1;min-width:0}
.screen{
 display:flex;height:clamp(65px,17vw,110px);
 padding:5px 2px;background:#080e15;
 border:1px solid #9755d0;border-radius:8px;
 box-shadow:0 0 20px #a44aff66;
}
.digit{flex:1;min-width:0}
.digit svg{
 width:100%;height:100%;
 filter:drop-shadow(0 0 5px #49ff63);
}
.label{margin-top:10px;font-size:10px;color:#aaffb8}
h2{color:#e7ceff}
.controls{
 margin-top:40px;padding:20px 12px;
 border:1px solid #ffffff33;
 border-radius:16px;background:#ffffff0b;
}
input,button{
 display:block;width:100%;max-width:360px;
 margin:12px auto;padding:14px;
 border-radius:10px;font-size:16px;
}
input{background:#201435;color:white;border:1px solid #9569c4}
button{background:#8742bd;color:white;border:0;font-weight:bold}
.share{background:#295a3c}
</style>
</head>
<body>
<div class="stars"></div>
<main>
<h1>UNTIL WE MEET AGAIN</h1>
<div class="planet">🪐</div>
<div class="clock" id="clock"></div>
<h2 id="eventTitle">Our Meeting 💜</h2>
<p id="eventDate"></p>

<div class="controls">
<h2>Create Your Countdown</h2>
<input id="name" placeholder="Event Name" maxlength="100">
<input id="date" type="datetime-local">
<button onclick="createTimer()">Create Countdown</button>
<button class="share" onclick="shareTimer()">Share Countdown 💚</button>
</div>
</main>

<script>
const params=new URLSearchParams(location.search);
const defaultDate="2026-11-14T00:05:00+01:00";
let target=new Date(defaultDate);
let title="Our Meeting 💜";

if(params.has("date")){
 const d=new Date(params.get("date"));
 if(!isNaN(d.getTime()))target=d;
}
if(params.has("title"))title=params.get("title").slice(0,100);

const segments={
 0:"abcdef",1:"bc",2:"abged",3:"abgcd",
 4:"fgbc",5:"afgcd",6:"afgecd",
 7:"abc",8:"abcdefg",9:"abfgcd"
};
const positions={
 a:[6,2,22,4],b:[27,5,4,21],
 c:[27,30,4,21],d:[6,51,22,4],
 e:[3,30,4,21],f:[3,5,4,21],
 g:[6,26,22,4]
};

function digit(n){
 return '<svg viewBox="0 0 34 57">'+
 Object.entries(positions).map(([k,p])=>
 '<rect x="'+p[0]+'" y="'+p[1]+
 '" width="'+p[2]+'" height="'+p[3]+
 '" rx="1" fill="'+
 (segments[n].includes(k)?"#49ff63":"#173b24")+
 '"/>').join("")+'</svg>';
}

function update(){
 let s=Math.max(0,Math.floor((target-Date.now())/1000));
 const values=[
 Math.floor(s/86400),
 Math.floor(s%86400/3600),
 Math.floor(s%3600/60),
 s%60
 ];
 const labels=["DAYS","HOURS","MIN","SEC"];
 document.getElementById("clock").innerHTML=
 values.map((v,i)=>
 '<div class="unit"><div class="screen">'+
 String(v).padStart(2,"0").split("")
 .map(x=>'<div class="digit">'+digit(x)+'</div>').join("")+
 '</div><div class="label">'+labels[i]+'</div></div>'
 ).join("");
 document.getElementById("eventTitle").textContent=title;
 document.getElementById("eventDate").textContent=
 target.toLocaleString("en-GB");
}

function createTimer(){
 const name=document.getElementById("name").value.trim();
 const value=document.getElementById("date").value;
 if(!value){alert("Please select a date and time");return}
 const d=new Date(value);
 if(isNaN(d.getTime()))return;
 target=d;
 title=name||"My Countdown";
 const url=new URL(location.href);
 url.searchParams.set("date",target.toISOString());
 url.searchParams.set("title",title);
 history.replaceState(null,"",url);
 update();
}

async function shareTimer(){
 const url=location.href;
 if(navigator.share){
 try{
 await navigator.share({title:"Cosmic Countdown",url});
 return;
 }catch(e){}
 }
 const tgUrl="https://t.me/share/url?url="+
 encodeURIComponent(url)+"&text="+
 encodeURIComponent(title);
 window.open(tgUrl,"_blank");
}

update();
setInterval(update,1000);
</script>
</body>
</html>
